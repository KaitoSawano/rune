description "Runecash Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env RUNECASHD_BIN="/usr/bin/runecashd"
env RUNECASHD_USER="runecash"
env RUNECASHD_GROUP="runecash"
env RUNECASHD_PIDDIR="/var/run/runecashd"
# upstart can't handle variables constructed with other variables
env RUNECASHD_PIDFILE="/var/run/runecashd/runecashd.pid"
env RUNECASHD_CONFIGFILE="/etc/runecash/runecash.conf"
env RUNECASHD_DATADIR="/var/lib/runecashd"

expect fork

respawn
respawn limit 5 120
kill timeout 60

pre-start script
    # this will catch non-existent config files
    # runecashd will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$RUNECASHD_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run runecashd."
        echo "The setting must appear in $RUNECASHD_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following"
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is also recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"Runecash Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$RUNECASHD_PIDDIR"
    chmod 0755 "$RUNECASHD_PIDDIR"
    chown $RUNECASHD_USER:$RUNECASHD_GROUP "$RUNECASHD_PIDDIR"
    chown $RUNECASHD_USER:$RUNECASHD_GROUP "$RUNECASHD_CONFIGFILE"
    chmod 0660 "$RUNECASHD_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$RUNECASHD_PIDFILE" \
    --chuid $RUNECASHD_USER:$RUNECASHD_GROUP \
    --exec "$RUNECASHD_BIN" \
    -- \
    -pid="$RUNECASHD_PIDFILE" \
    -conf="$RUNECASHD_CONFIGFILE" \
    -datadir="$RUNECASHD_DATADIR" \
    -disablewallet \
    -daemon

